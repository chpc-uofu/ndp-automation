---
- name: Create new NDP VMs
  hosts: 127.0.0.1
  connection: local
  gather_facts: false
  tags: always
  vars_files:
    - "../inventories/group_vars/all.yml"
  vars:
    ndp_ansible_limit: "" # same syntax as --limit

  tasks:
    - name: Initialize inventory limits when non are provided
      when: ndp_ansible_limit | length < 1
      ansible.builtin.set_fact:
        limit_raw: "{{ groups['all'] }}"
        limit_resolved_hosts: []

    - name: Initialize inventory limits
      when: ndp_ansible_limit | length > 0
      ansible.builtin.set_fact:
        limit_raw: "{{ ndp_ansible_limit.split(',') }}"
        limit_resolved_hosts: []

    - name: Add group members when limit item is an inventory group
      when: item in groups
      ansible.builtin.set_fact:
        limit_resolved_hosts: "{{ limit_resolved_hosts + groups[item] }}"
      loop: "{{ limit_raw }}"

    - name: Add host when limit item is an inventory host
      when: item not in groups and item in hostvars
      ansible.builtin.set_fact:
        limit_resolved_hosts: "{{ limit_resolved_hosts + [item] }}"
      loop: "{{ limit_raw }}"

    - name: Fail if limit items are not valid
      when: item not in groups and item not in hostvars
      ansible.builtin.fail:
        msg: "Limit item '{{ item }}' is not a group or an inventory host."
      loop: "{{ limit_raw }}"

    - name: Gather resolved limited hosts
      ansible.builtin.set_fact:
        limit_resolved_hosts: "{{ limit_resolved_hosts | unique }}"

    - name: Create new VMs
      vars:
        new_vm_mac_address: "{{ hostvars[item]['vm_network_adapters_mac_address'] }}"
        new_vm_vlan_tag: "{{ hostvars[item]['vm_network_vlan_tag'] }}"
      community.proxmox.proxmox_kvm:
        # Connection config
        api_host: "{{ proxmox_api_host }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        api_user: "{{ proxmox_api_user }}"
        node: "{{ hostvars[item]['proxmox_node'] }}"
        timeout: 3000

        # Boot config
        bios: ovmf
        boot: 'order=scsi0;net0'
        efidisk0:
          storage: "{{ hostvars[item]['proxmox_storage_pool'] }}"
          format: raw
          efitype: 4m
          pre_enrolled_keys: false

        # VM config
        agent: true
        # args: '--rng0 "source=/dev/urandom,max_bytes=1024,period=1000"'  ## apparently requires root@pam
        cores: "{{ hostvars[item]['vm_cpu_cores'] }}"
        cpu: "{{ hostvars[item]['vm_cpu_type'] }}"
        description: "{{ hostvars[item]['vm_description'] }}"
        memory: "{{ hostvars[item]['vm_memory'] }}"
        name: "{{ hostvars[item]['inventory_hostname'] }}"
        net:
          net0: 'virtio={{ new_vm_mac_address }},bridge=vmbr1,tag={{ new_vm_vlan_tag }}'
        ostype: l26
        scsi:
          scsi0: "{{ hostvars[item]['proxmox_storage_pool'] }}:{{ hostvars[item]['vm_os_disk_size'] | regex_search('[0-9]+') }}"
        scsihw: virtio-scsi-single
        sockets: 1
        vga: std
        vmid: "{{ hostvars[item]['vm_id'] }}"
      register: created_vms
      # until: created_vms is not failed
      # retries: 10
      loop: "{{ limit_resolved_hosts }}"

    - name: Retrieve information about specific VM by ID
      vars:
        new_vm_id: "{{ hostvars[item]['vm_id'] }}"
      community.proxmox.proxmox_vm_info:
        api_host: "{{ proxmox_api_host }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        api_user: "{{ proxmox_api_user }}"
        type: qemu
        vmid: "{{ new_vm_id }}"
      loop: "{{ limit_resolved_hosts }}"
      register: current_vms_info

    - name: Set additional facts
      ansible.builtin.set_fact:
        current_vms_stopped: "{{ (current_vms_info['results'] | map(attribute='proxmox_vms')) | flatten | selectattr('status', 'eq', 'stopped') | map(attribute='vmid') }}"   # noqa yaml[line-length]

    - name: Ensure VirtIO RNG that is required for PXE is set for stopped VMs
      block:
        - name: Ensure VirtIO RNG that is required for PXE is set for stopped VMs
          when: hostvars[item]['vm_id'] in current_vms_stopped
          ansible.builtin.uri:
            url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ hostvars[item]['proxmox_node'] }}/qemu/{{ hostvars[item]['vm_id'] }}/config"
            method: POST
            headers:
              Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
            body_format: form-urlencoded
            body:
              rng0: "source=/dev/urandom,max_bytes=1024,period=1000"
            return_content: false
            validate_certs: false
          loop: "{{ limit_resolved_hosts }}"
          register: rng_update
          changed_when: true
          failed_when: rng_update['status'] != 200
          no_log: true # prevents secrets exposure in plain-text logs
      always:
        - name: Display API call results without secrets
          ansible.builtin.debug:
            msg: >-
              {% set output = [] %}
              {% for result in rng_update['results'] %}
              {{ output.append(result['item'] + ': ' + (result['msg']) | default("N/A")) }}
              {% endfor %}
              {{ output }}

    - name: Ensure VMs are started
      vars:
        new_vm_id: "{{ hostvars[item]['vm_id'] }}"
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        api_user: "{{ proxmox_api_user }}"
        vmid: "{{ hostvars[item]['vm_id'] }}"
        state: started
      loop: "{{ limit_resolved_hosts }}"

